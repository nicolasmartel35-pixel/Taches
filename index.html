<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mes 5 tâches</title>

<!-- Installation sur l'écran d'accueil (iOS / iPadOS) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="5 tâches">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16161a" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">

<script>
/* Icône et manifest générés directement dans ce fichier (pas besoin d'autres fichiers). */
(function () {
  function makeIcon(size) {
    var c = document.createElement('canvas');
    c.width = c.height = size;
    var x = c.getContext('2d');
    var g = x.createLinearGradient(0, 0, size, size);
    g.addColorStop(0, '#ee6a3a');
    g.addColorStop(1, '#c4441c');
    x.fillStyle = g;
    x.fillRect(0, 0, size, size);
    x.fillStyle = '#ffffff';
    x.font = '800 ' + Math.round(size * 0.6) + 'px -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif';
    x.textAlign = 'center';
    x.textBaseline = 'middle';
    x.fillText('5', size * 0.5, size * 0.5);
    // petite coche en bas à droite
    x.strokeStyle = '#ffffff';
    x.lineWidth = size * 0.045;
    x.lineCap = 'round';
    x.lineJoin = 'round';
    x.beginPath();
    x.moveTo(size * 0.66, size * 0.80);
    x.lineTo(size * 0.72, size * 0.86);
    x.lineTo(size * 0.84, size * 0.73);
    x.stroke();
    return c.toDataURL('image/png');
  }
  function addLink(rel, href, extra) {
    var l = document.createElement('link');
    l.rel = rel; l.href = href;
    if (extra) for (var k in extra) l.setAttribute(k, extra[k]);
    document.head.appendChild(l);
  }
  try {
    var icon180 = makeIcon(180);
    var icon512 = makeIcon(512);
    addLink('apple-touch-icon', icon180, { sizes: '180x180' });
    addLink('icon', icon180, { type: 'image/png' });
    var here = location.href.split('#')[0].split('?')[0];
    var manifest = {
      name: 'Mes 5 tâches',
      short_name: '5 tâches',
      lang: 'fr',
      start_url: here,
      scope: new URL('./', here).href,
      display: 'standalone',
      orientation: 'any',
      background_color: '#16161a',
      theme_color: '#d9572b',
      icons: [
        { src: icon180, sizes: '180x180', type: 'image/png' },
        { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'any' }
      ]
    };
    addLink('manifest', 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifest)));
  } catch (e) { /* sans gravité : l'app fonctionne quand même */ }
})();
</script>

<style>
  :root {
    --bg: #f4f1ea;
    --card: #fffdf8;
    --text: #1d1b18;
    --muted: #6f6a61;
    --line: #e3ddd1;
    --accent: #d9572b;
    --accent-press: #b8461f;
    --accent-text: #ffffff;
    --done: #2f8f5b;
    --done-bg: #e5f1e9;
    --warn-bg: #fbecd9;
    --nav-bg: rgba(255, 253, 248, 0.92);
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 14px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16161a;
      --card: #212127;
      --text: #f1efe9;
      --muted: #9b978f;
      --line: #303038;
      --accent: #ff7a45;
      --accent-press: #e5652f;
      --accent-text: #1a0d06;
      --done: #5cc98a;
      --done-bg: #1c3226;
      --warn-bg: #3a2a18;
      --nav-bg: rgba(33, 33, 39, 0.92);
      --shadow: none;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 17px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
    min-height: 100vh;
    padding-top: env(safe-area-inset-top);
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 20px 16px calc(110px + env(safe-area-inset-bottom));
  }
  header { margin: 8px 0 20px; }
  .eyebrow {
    font-size: 14px; font-weight: 600; letter-spacing: .04em;
    text-transform: uppercase; color: var(--accent); margin: 0 0 4px;
  }
  h1 { font-size: 30px; line-height: 1.15; margin: 0; font-weight: 800; letter-spacing: -.01em; }

  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 18px; box-shadow: var(--shadow);
  }

  /* Progression */
  .progress { display: flex; align-items: center; gap: 12px; margin: 0 0 14px; }
  .bar { flex: 1; height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--done); border-radius: 99px; transition: width .3s ease; }
  .count { font-weight: 700; font-size: 15px; color: var(--muted); min-width: 64px; text-align: right; }

  /* Liste des tâches */
  .tasks { list-style: none; margin: 0; padding: 0; overflow: hidden; }
  .tasks li + li { border-top: 1px solid var(--line); }
  .task {
    width: 100%; display: flex; align-items: center; gap: 14px;
    min-height: 64px; padding: 14px 16px;
    background: none; border: 0; color: inherit; font: inherit; text-align: left;
    cursor: pointer;
  }
  .task:active { background: var(--line); }
  .box {
    flex: none; width: 30px; height: 30px; border-radius: 50%;
    border: 2.5px solid var(--muted); display: grid; place-items: center;
    transition: background .15s, border-color .15s;
  }
  .box svg { width: 16px; height: 16px; opacity: 0; transition: opacity .15s; }
  .num { flex: none; font-weight: 700; color: var(--muted); width: 18px; }
  .label { flex: 1; word-break: break-word; }
  .task.done .box { background: var(--done); border-color: var(--done); }
  .task.done .box svg { opacity: 1; }
  .task.done .label { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1.5px; }

  .bravo {
    margin: 14px 0 0; padding: 14px 16px; border-radius: 14px;
    background: var(--done-bg); color: var(--done); font-weight: 600; text-align: center;
  }

  /* Formulaire */
  .field { display: flex; align-items: center; gap: 12px; padding: 8px 14px; }
  .field + .field { border-top: 1px solid var(--line); }
  .field .n {
    flex: none; width: 30px; height: 30px; border-radius: 50%;
    background: var(--accent); color: var(--accent-text);
    display: grid; place-items: center; font-weight: 800; font-size: 15px;
  }
  .field input {
    flex: 1; min-width: 0; height: 48px; border: 0; outline: none;
    background: transparent; color: var(--text);
    font: inherit; font-size: 17px; /* ≥16px : évite le zoom auto de Safari */
  }
  .field input::placeholder { color: var(--muted); opacity: .7; }

  .btn {
    display: block; width: 100%; min-height: 56px; margin-top: 16px;
    border: 0; border-radius: 16px; font: inherit; font-weight: 700; font-size: 18px;
    background: var(--accent); color: var(--accent-text); cursor: pointer;
  }
  .btn:active { background: var(--accent-press); }
  .btn.ghost { background: transparent; color: var(--accent); border: 1.5px solid var(--line); font-weight: 600; font-size: 17px; }
  .btn.ghost:active { background: var(--line); }
  .row { display: flex; gap: 10px; }
  .row .btn { flex: 1; }

  .note { color: var(--muted); font-size: 15px; margin: 12px 4px 0; }
  .empty { padding: 26px 20px; text-align: center; }
  .empty .big { font-size: 44px; line-height: 1; margin-bottom: 10px; }
  .empty h2 { font-size: 21px; margin: 0 0 8px; }
  .empty p { color: var(--muted); margin: 0; }

  .tip {
    background: var(--warn-bg); border-radius: 14px; padding: 12px 14px;
    font-size: 15px; margin: 0 0 18px; display: flex; gap: 10px; align-items: flex-start;
  }
  .tip button { flex: none; background: none; border: 0; color: var(--muted); font-size: 22px; line-height: 1; padding: 0 2px; cursor: pointer; }

  /* Barre du bas (zone du pouce) */
  nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    background: var(--nav-bg);
    -webkit-backdrop-filter: saturate(180%) blur(16px); backdrop-filter: saturate(180%) blur(16px);
    border-top: 1px solid var(--line);
    padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
  }
  nav .in { max-width: 560px; margin: 0 auto; display: flex; gap: 8px; }
  nav button {
    flex: 1; min-height: 54px; border: 0; border-radius: 14px; background: transparent;
    color: var(--muted); font: inherit; font-size: 13px; font-weight: 600;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    position: relative; cursor: pointer;
  }
  nav button svg { width: 24px; height: 24px; }
  nav button.on { color: var(--accent); background: var(--line); }
  nav .dot {
    position: absolute; top: 8px; left: calc(50% + 10px);
    width: 9px; height: 9px; border-radius: 50%; background: var(--accent);
  }

  .toast {
    position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(20px); opacity: 0; pointer-events: none;
    background: var(--text); color: var(--bg); padding: 12px 18px; border-radius: 14px;
    font-weight: 600; font-size: 15px; transition: all .25s ease; z-index: 10;
    max-width: calc(100% - 32px); text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (min-width: 700px) { h1 { font-size: 36px; } .wrap { padding-top: 40px; } }
</style>
</head>
<body>
  <div class="wrap">
    <div id="tip"></div>
    <header>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="title"></h1>
    </header>
    <main id="main"></main>
  </div>

  <nav>
    <div class="in">
      <button id="tab-today" type="button" aria-label="Aujourd'hui">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg>
        Aujourd'hui
      </button>
      <button id="tab-tomorrow" type="button" aria-label="Demain">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        Demain
        <span class="dot" id="dot" hidden></span>
      </button>
    </div>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  var STORE = 'cinq-taches-v1';
  var DAY_START_HOUR = 4;   // la "journée" commence à 4 h : saisir à 0 h 30 compte encore comme la veille au soir
  var EVENING_HOUR = 18;    // à partir de 18 h, l'app s'ouvre sur "Demain" si la liste n'est pas faite
  var KEEP_DAYS = 60;       // historique conservé

  var storageOK = true;
  var data = load();
  var view = null;          // 'today' | 'tomorrow'
  var editingToday = false;
  var currentKey = null;

  /* ---------- Stockage ---------- */
  function load() {
    try {
      var raw = localStorage.getItem(STORE);
      var d = raw ? JSON.parse(raw) : null;
      if (d && typeof d.days === 'object') return d;
    } catch (e) { storageOK = false; }
    return { days: {} };
  }
  function persist() {
    try { localStorage.setItem(STORE, JSON.stringify(data)); storageOK = true; return true; }
    catch (e) { storageOK = false; return false; }
  }

  /* ---------- Dates ---------- */
  function logicalDate(offset) {
    var d = new Date(Date.now() - DAY_START_HOUR * 3600000);
    d.setHours(12, 0, 0, 0);
    d.setDate(d.getDate() + offset);
    return d;
  }
  function keyOf(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function labelOf(d) {
    var s = d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
    return s.charAt(0).toUpperCase() + s.slice(1);
  }
  function cleanup() {
    var limit = keyOf(logicalDate(-KEEP_DAYS));
    Object.keys(data.days).forEach(function (k) { if (k < limit) delete data.days[k]; });
  }

  /* ---------- Petits outils d'affichage ---------- */
  function h(tag, attrs, children) {
    var el = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === 'class') el.className = attrs[k];
      else if (k === 'text') el.textContent = attrs[k];
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), attrs[k]);
      else el.setAttribute(k, attrs[k]);
    }
    (children || []).forEach(function (c) {
      if (c == null) return;
      el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return el;
  }
  function checkIcon() {
    var s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    s.setAttribute('viewBox', '0 0 16 16');
    s.innerHTML = '<path d="M3.5 8.5l3 3 6-7" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>';
    return s;
  }
  var toastTimer;
  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2200);
  }

  function filledItems(entry) {
    var out = [];
    entry.tasks.forEach(function (t, i) { if (t && t.trim()) out.push(i); });
    return out;
  }

  /* ---------- Formulaire (soir ou rattrapage du jour) ---------- */
  function buildForm(dayKey, buttonText, onDone) {
    var existing = data.days[dayKey];
    var inputs = [];
    var box = h('div', { class: 'card' });
    for (var i = 0; i < 5; i++) {
      var inp = h('input', {
        type: 'text',
        placeholder: 'Tâche ' + (i + 1),
        autocomplete: 'off',
        autocapitalize: 'sentences',
        enterkeyhint: i < 4 ? 'next' : 'done',
        maxlength: '140',
        'aria-label': 'Tâche ' + (i + 1)
      });
      inp.value = existing ? (existing.tasks[i] || '') : '';
      (function (idx) {
        inp.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            if (idx < 4) inputs[idx + 1].focus(); else inputs[idx].blur();
          }
        });
      })(i);
      inputs.push(inp);
      box.appendChild(h('div', { class: 'field' }, [h('span', { class: 'n', text: String(i + 1) }), inp]));
    }
    var btn = h('button', {
      class: 'btn', type: 'button', text: buttonText,
      onclick: function () {
        var tasks = inputs.map(function (x) { return x.value.trim(); });
        if (!tasks.some(Boolean)) { toast('Écris au moins une tâche'); inputs[0].focus(); return; }
        var old = data.days[dayKey];
        var done = tasks.map(function (t, i) {
          // on garde la coche si la tâche n'a pas changé
          return !!(old && old.tasks[i] === t && old.done[i]);
        });
        data.days[dayKey] = { tasks: tasks, done: done, savedAt: new Date().toISOString() };
        cleanup();
        if (persist()) { document.activeElement && document.activeElement.blur(); onDone(); }
        else toast("Impossible d'enregistrer sur cet appareil");
      }
    });
    return { box: box, btn: btn, first: inputs[0] };
  }

  /* ---------- Partage (pour l'alternative widget via Notes) ---------- */
  function shareList(entry, d) {
    var lines = ['Mes 5 tâches — ' + labelOf(d)];
    filledItems(entry).forEach(function (i) {
      lines.push((entry.done[i] ? '✅ ' : '⬜️ ') + (i + 1) + '. ' + entry.tasks[i]);
    });
    var text = lines.join('\n');
    if (navigator.share) {
      navigator.share({ text: text }).catch(function () {});
    } else if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(function () { toast('Liste copiée'); }, function () { toast('Copie impossible'); });
    }
  }

  /* ---------- Vues ---------- */
  function renderToday(main) {
    var d = logicalDate(0), k = keyOf(d), entry = data.days[k];
    document.getElementById('eyebrow').textContent = "Aujourd'hui";
    document.getElementById('title').textContent = labelOf(d);

    if (editingToday) {
      var f = buildForm(k, "Enregistrer pour aujourd'hui", function () {
        editingToday = false; toast('Liste du jour enregistrée'); render();
      });
      main.appendChild(f.box);
      main.appendChild(h('div', { class: 'row' }, [
        h('button', { class: 'btn ghost', type: 'button', text: 'Annuler', onclick: function () { editingToday = false; render(); } }),
        f.btn
      ]));
      if (!entry) setTimeout(function () { f.first.focus(); }, 50);
      return;
    }

    if (!entry || !filledItems(entry).length) {
      main.appendChild(h('div', { class: 'card empty' }, [
        h('div', { class: 'big', text: '🌅' }),
        h('h2', { text: "Pas de liste pour aujourd'hui" }),
        h('p', { text: "Tu n'as pas préparé tes tâches hier soir. Pas de souci : saisis maintenant tes 5 choses importantes du jour." })
      ]));
      main.appendChild(h('button', { class: 'btn', type: 'button', text: 'Saisir mes tâches du jour', onclick: function () { editingToday = true; render(); } }));
      return;
    }

    var items = filledItems(entry);
    var nDone = items.filter(function (i) { return entry.done[i]; }).length;

    var fill = h('i'); fill.style.width = (items.length ? nDone / items.length * 100 : 0) + '%';
    main.appendChild(h('div', { class: 'progress' }, [
      h('div', { class: 'bar' }, [fill]),
      h('span', { class: 'count', text: nDone + ' / ' + items.length + ' faites' })
    ]));

    var list = h('ul', { class: 'tasks card' });
    items.forEach(function (i) {
      var btn = h('button', {
        class: 'task' + (entry.done[i] ? ' done' : ''), type: 'button',
        role: 'checkbox', 'aria-checked': entry.done[i] ? 'true' : 'false',
        onclick: function () { entry.done[i] = !entry.done[i]; persist(); render(); }
      }, [
        h('span', { class: 'box' }, [checkIcon()]),
        h('span', { class: 'num', text: String(i + 1) }),
        h('span', { class: 'label', text: entry.tasks[i] })
      ]);
      list.appendChild(h('li', null, [btn]));
    });
    main.appendChild(list);

    if (nDone === items.length) {
      main.appendChild(h('div', { class: 'bravo', text: '🎉 Tout est fait. Bravo !' }));
    }

    main.appendChild(h('div', { class: 'row' }, [
      h('button', { class: 'btn ghost', type: 'button', text: 'Modifier', onclick: function () { editingToday = true; render(); } }),
      h('button', { class: 'btn ghost', type: 'button', text: 'Partager', onclick: function () { shareList(entry, d); } })
    ]));
  }

  function renderTomorrow(main) {
    var d = logicalDate(1), k = keyOf(d), entry = data.days[k];
    document.getElementById('eyebrow').textContent = 'Pour demain';
    document.getElementById('title').textContent = labelOf(d);

    var f = buildForm(k, 'Enregistrer pour demain', function () {
      toast('Enregistré. À demain matin !');
      render();
    });
    main.appendChild(f.box);
    main.appendChild(f.btn);
    main.appendChild(h('p', { class: 'note', text: entry
      ? "✓ Liste déjà enregistrée. Tu peux encore la modifier ce soir."
      : "Note les 5 choses importantes à faire demain. Elles s'afficheront automatiquement demain matin." }));
  }

  function renderTip() {
    var tip = document.getElementById('tip');
    tip.innerHTML = '';
    var standalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
    var dismissed = false;
    try { dismissed = localStorage.getItem(STORE + '-tip') === '1'; } catch (e) {}
    if (!storageOK) {
      tip.appendChild(h('div', { class: 'tip' }, [h('span', { text: "⚠️ Ce navigateur bloque l'enregistrement (navigation privée ?). Tes tâches ne seront pas conservées." })]));
      return;
    }
    if (standalone || dismissed) return;
    tip.appendChild(h('div', { class: 'tip' }, [
      h('span', { text: "Pour installer l'app : bouton Partager ⬆︎ puis « Sur l'écran d'accueil ». Ensuite, utilise uniquement l'icône : ce que tu saisis ici dans Safari n'y sera pas repris." }),
      h('button', { type: 'button', 'aria-label': 'Fermer', text: '×', onclick: function () {
        try { localStorage.setItem(STORE + '-tip', '1'); } catch (e) {}
        renderTip();
      } })
    ]));
  }

  function render() {
    var main = document.getElementById('main');
    main.innerHTML = '';
    if (view === 'today') renderToday(main); else renderTomorrow(main);
    document.getElementById('tab-today').classList.toggle('on', view === 'today');
    document.getElementById('tab-tomorrow').classList.toggle('on', view === 'tomorrow');
    var hr = new Date().getHours();
    var evening = hr >= EVENING_HOUR || hr < DAY_START_HOUR;
    document.getElementById('dot').hidden = !(evening && !data.days[keyOf(logicalDate(1))]);
    renderTip();
  }

  function defaultView() {
    var hr = new Date().getHours();
    var evening = hr >= EVENING_HOUR || hr < DAY_START_HOUR;
    return (evening && !data.days[keyOf(logicalDate(1))]) ? 'tomorrow' : 'today';
  }

  // Passage automatique au jour suivant (app restée ouverte ou rouverte le matin)
  function checkDay(force) {
    var k = keyOf(logicalDate(0));
    if (force || k !== currentKey) {
      currentKey = k;
      editingToday = false;
      view = defaultView();
      render();
    }
  }

  document.getElementById('tab-today').addEventListener('click', function () { view = 'today'; render(); window.scrollTo(0, 0); });
  document.getElementById('tab-tomorrow').addEventListener('click', function () { view = 'tomorrow'; editingToday = false; render(); window.scrollTo(0, 0); });

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) {
      data = load();
      var k = keyOf(logicalDate(0));
      if (k !== currentKey) checkDay(true); else render();
    }
  });
  setInterval(function () { checkDay(false); }, 60000);

  cleanup();
  checkDay(true);
})();
</script>
